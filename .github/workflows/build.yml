name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # the v* tags cmake/Version.cmake reads are out of reach of a shallow checkout
          fetch-depth: 0
      - run: brew install ninja
      - name: Configure (universal)
        run: cmake -S . -B build -G Ninja -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
      - name: Build
        run: cmake --build build
      - name: Regression vs the original (arm64)
        run: ./build/sq8l_render_check --regression tests/regression
      - name: Regression vs the original (x86_64, Rosetta)
        run: |
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 ./build/sq8l_render_check --regression tests/regression
      - name: More polyphony (port addition)
        run: ./build/sq8l_render_check --polyphony tests/regression
      - name: Output gain (port addition)
        run: ./build/sq8l_render_check --output-gain tests/regression
      - name: Editor additions of the port
        run: SQ8L_TESTAPI=$PWD/build/libsq8l_testapi.dylib python3 tests/test_gui_extensions.py
      - name: HD graphics
        run: ./build/sq8l_hd_check
      # Code signing and notarization (Developer ID) go here once certificates are set up
      # as repository secrets; until then package.sh signs the bundles ad hoc.
      - name: Package
        run: tools/package.sh build macos SQ8L-macOS-universal.zip
      - name: Validate the packaged Audio Unit
        run: |
          ditto -x -k SQ8L-macOS-universal.zip pkg
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R pkg/SQ8L/SQ8L.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu SQ8L SQ8L
      - name: Audio Unit presets and state as a host drives them
        run: MallocScribble=1 ./build/sq8l_au_check pkg/SQ8L/SQ8L.component
      - uses: actions/upload-artifact@v7
        with:
          name: SQ8L-macOS-universal
          path: SQ8L-macOS-universal.zip

  windows-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # the v* tags cmake/Version.cmake reads are out of reach of a shallow checkout
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 ninja-build zip
      - name: Configure (MinGW-w64, x64)
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DMINGW_SUFFIX=-posix
      - name: Build
        run: cmake --build build
      - name: Package
        run: tools/package.sh build windows SQ8L-Windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: SQ8L-Windows-x64
          path: SQ8L-Windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows-render-check
          path: |
            build/sq8l_render_check.exe
            tests/regression

  windows-verify:
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-render-check
      - name: Regression vs the original on real Windows
        run: ./build/sq8l_render_check.exe --regression tests/regression
      - name: More polyphony on real Windows
        run: ./build/sq8l_render_check.exe --polyphony tests/regression
      - name: Output gain on real Windows
        run: ./build/sq8l_render_check.exe --output-gain tests/regression

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # the v* tags cmake/Version.cmake reads are out of reach of a shallow checkout
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxcursor-dev libxrandr-dev libgl-dev \
            libdbus-1-dev xvfb xdotool imagemagick libgl1-mesa-dri
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Regression vs the original
        run: ./build/sq8l_render_check --regression tests/regression
      - name: More polyphony (port addition)
        run: ./build/sq8l_render_check --polyphony tests/regression
      - name: Output gain (port addition)
        run: ./build/sq8l_render_check --output-gain tests/regression
      - name: Drawn menus and dialogs
        run: ./build/sq8l_drawn_check
      - name: HD graphics
        run: ./build/sq8l_hd_check
      - name: Editor additions of the port
        run: SQ8L_TESTAPI=$PWD/build/libsq8l_testapi.so python3 tests/test_gui_extensions.py
      - name: The version injected into the build
        run: python3 tests/test_version.py
      - name: Editor on an X server (Xvfb)
        run: |
          sh tests/linux_ui_session.sh build/bin/SQ8L.so ui-session \
            "c 105,12; m 110,125; c 330,161; c 40,52; k Escape; c 406,63; k Down; c 362,380; c 168,12; k Escape"
          grep -q "^closed" ui-session/host.log
      - name: A menu or dialog left open does not hold the host up
        run: |
          sh tests/linux_ui_session.sh build/bin/SQ8L.so menu-hold \
            "c 105,12; w 6; k Escape; c 30,12; c 60,72; w 6; k Escape"
          grep "^longest idle call" menu-hold/host.log
          awk '/^longest idle call/ { ok = $4 < 500 } END { exit !ok }' menu-hold/host.log
      - name: Package
        run: tools/package.sh build linux SQ8L-Linux-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: SQ8L-Linux-${{ matrix.arch }}
          path: SQ8L-Linux-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-ui-session-${{ matrix.arch }}
          path: ui-session

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows-verify, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/release-notes.md
            CMakeLists.txt
          sparse-checkout-cone-mode: false
      # project() is maintained by hand, so a tag can disagree with what the binaries report.
      - name: The tag matches the version the build reports
        run: |
          number=$(sed -n 's/^project(sq8l VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          tag=${GITHUB_REF_NAME#v}
          case $tag in
            "$number" | "$number"-*) echo "$GITHUB_REF_NAME matches project version $number" ;;
            *) echo "::error::tag $GITHUB_REF_NAME does not match project(sq8l VERSION $number)"; exit 1 ;;
          esac
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: SQ8L-*
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: SQ8L ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            artifacts/SQ8L-macOS-universal/SQ8L-macOS-universal.zip
            artifacts/SQ8L-Windows-x64/SQ8L-Windows-x64.zip
            artifacts/SQ8L-Linux-x64/SQ8L-Linux-x64.tar.gz
            artifacts/SQ8L-Linux-arm64/SQ8L-Linux-arm64.tar.gz

  # Every push to main (a merged PR) moves the "nightly" tag to it and replaces the files of
  # the rolling "nightly" pre-release. Numbered releases still come from v* tags, above.
  nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [macos, windows-verify, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: nightly
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: SQ8L-*
      - name: Publish the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A newer push publishes its own build; this one would only overwrite it.
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main has moved on to $head: not publishing $GITHUB_SHA"
            exit 0
          fi
          short=$(git rev-parse --short HEAD)
          last=$(git describe --tags --abbrev=0 --match 'v*')
          {
            echo "**Automatic build of \`main\` at $short ($(git log -1 --format=%cs)).** It is rebuilt"
            echo "after every merged pull request and passed the same checks as a release, but it has"
            echo "not been tried by hand: for that, take the latest numbered release."
            echo
            echo "### Changes since $last"
            echo
            git log --no-merges --format='- %s (%h)' "$last..HEAD"
            echo
            cat .github/release-notes.md
          } > notes.md
          git tag -f nightly
          git push -f origin refs/tags/nightly
          title="SQ8L nightly ($short)"
          files="artifacts/SQ8L-macOS-universal/SQ8L-macOS-universal.zip
            artifacts/SQ8L-Windows-x64/SQ8L-Windows-x64.zip
            artifacts/SQ8L-Linux-x64/SQ8L-Linux-x64.tar.gz
            artifacts/SQ8L-Linux-arm64/SQ8L-Linux-arm64.tar.gz"
          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --title "$title" --notes-file notes.md --prerelease --latest=false
            gh release upload nightly --clobber $files
          else
            gh release create nightly --title "$title" --notes-file notes.md --prerelease --latest=false \
              --verify-tag $files
          fi
